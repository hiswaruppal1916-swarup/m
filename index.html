<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MediTime — Smart Medicine Reminder</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0D9488" />
    <meta name="description" content="Never Miss Your Medicine. Smart Medicine and Meal-Aware Reminder Platform." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MediTime" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="MediTime" />

    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Preconnect to Google Fonts for Bengali font support fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for offline-first PWA caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('MediTime SW registered with scope: ', registration.scope);
            },
            (err) => {
              console.log('MediTime SW registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
